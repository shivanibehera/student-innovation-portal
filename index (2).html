<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Innovation Portal</title>
  <meta name="description"
    content="Campus innovation showcase, student idea submission, peer voting, comments, and live ranked leaderboard portal." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #F1F4F9;
      color: #101828;
    }

    h1,
    h2,
    h3,
    .hd {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .in {
      width: 100%;
      border: 1px solid #D0D7E4;
      border-radius: 10px;
      padding: .65rem .85rem;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }

    .in:focus {
      border-color: #2447F5;
      outline: none;
      box-shadow: 0 0 0 3px rgba(36, 71, 245, .15);
    }

    button:focus-visible,
    select:focus-visible {
      outline: 2px solid #2447F5;
      outline-offset: 2px;
    }

    .btn {
      background: #2447F5;
      color: #fff;
      font-weight: 700;
      border-radius: 10px;
      padding: .6rem 1.1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color .15s, transform .1s;
    }

    .btn:hover {
      background: #1a37c4;
    }

    .btn:active {
      transform: scale(.99);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .ghost {
      border: 1px solid #D0D7E4;
      border-radius: 10px;
      padding: .45rem .85rem;
      font-weight: 600;
      background: #fff;
      cursor: pointer;
      transition: all .15s;
    }

    .ghost:hover {
      border-color: #2447F5;
      color: #2447F5;
    }

    .vote {
      width: 64px;
      border: 1px solid #D0D7E4;
      border-radius: 12px;
      background: #fff;
      text-align: center;
      padding: .5rem 0;
      flex: none;
      cursor: pointer;
      transition: all .15s;
    }

    .vote:hover {
      border-color: #2447F5;
    }

    .vote.on {
      background: #2447F5;
      color: #fff;
      border-color: #2447F5;
    }

    .pulse-rank {
      animation: pulseRank 2s infinite ease-in-out;
    }

    @keyframes pulseRank {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }
    }

    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    @media (prefers-reduced-motion:no-preference) {
      .toast {
        animation: t .25s ease-out;
      }

      @keyframes t {
        from {
          transform: translateY(8px);
          opacity: 0;
        }
      }
    }
  </style>
</head>

<body>
  <div id="app" class="min-h-screen"></div>
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>

  <script type="module">
    // ==============================================================================
    // 1. Supabase Client Configuration (Deployment Ready)
    // ==============================================================================
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const storedUrl = localStorage.getItem("sip_supabase_url") || "";
    const storedKey = localStorage.getItem("sip_supabase_key") || "";

    let SUPABASE_URL = storedUrl || "";       // e.g. "https://your-project.supabase.co"
    let SUPABASE_ANON_KEY = storedKey || "";  // e.g. "eyJhbGciOi..."
    // Admin authorization is granted only by Supabase Auth app_metadata.role,
    // which must be assigned server-side by a trusted project administrator.
    // Replace this with the email address of the admin user you create in Supabase Auth.
    // The login form can then accept the short ID "admin"; Supabase still authenticates by email.
    const ADMIN_LOGIN_EMAIL = "shivanibehera16@gmail.com";
    const isTrustedAdmin = user => user?.app_metadata?.role === "admin";
    const adminProfile = user => ({
      id: user.id,
      full_name: user.user_metadata?.full_name || "Faculty Administrator",
      email: user.email,
      department: "Administration",
      roll_number: "ADMIN"
    });

    const CATS = [
      "Aerospace / Aeronautical Engineering",
      "Agricultural Engineering",
      "AI & Machine Learning",
      "Automobile Engineering",
      "Biomedical Engineering",
      "Biotechnology",
      "Chemical Engineering",
      "Civil Engineering",
      "Computer Science & Engineering (CSE)",
      "Cyber Security",
      "Data Science & Analytics",
      "EdTech",
      "Electrical & Electronics (EEE)",
      "Electronics & Communication (ECE)",
      "Environmental Engineering",
      "FinTech",
      "Food Technology",
      "HealthTech",
      "Industrial & Production Engineering",
      "Information Technology (IT)",
      "Instrumentation Engineering",
      "IoT & Hardware",
      "Marine & Naval Engineering",
      "Mechanical Engineering",
      "Mechatronics & Robotics",
      "Metallurgical & Materials Engineering",
      "Mining Engineering",
      "Nanotechnology",
      "Petroleum Engineering",
      "Smart Campus",
      "Sustainability & Green Tech",
      "Textile Engineering",
      "Other"
    ];

    let supabase = null;
    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      try {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.error("Supabase init error:", err);
      }
    }

    // ==============================================================================
    // Built-in Database Seeding: Guarantees working out-of-the-box experience
    // ==============================================================================
    const DEMO_IDEAS = [];

    // ==============================================================================
    // Security: Web Crypto Cryptographic Hashing & Brute-Force Rate Limiting
    // ==============================================================================
    async function hashPassword(text) {
      if (!text) return "";
      const enc = new TextEncoder().encode(text + "_sip_salt_2026_campus_sec");
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    let failedLoginAttempts = 0;
    let lockoutUntil = 0;
    function checkRateLimit() {
      if (Date.now() < lockoutUntil) {
        const remainingSec = Math.ceil((lockoutUntil - Date.now()) / 1000);
        throw new Error(`Login temporarily locked due to repeated failed attempts. Please wait ${remainingSec}s.`);
      }
    }
    function recordFailedAttempt() {
      failedLoginAttempts++;
      if (failedLoginAttempts >= 5) {
        lockoutUntil = Date.now() + 30000; // 30-second security cooldown
        failedLoginAttempts = 0;
      }
    }
    function resetRateLimit() {
      failedLoginAttempts = 0;
      lockoutUntil = 0;
    }

    // ==============================================================================
    // 2. Application State (Fresh Deployment State - No Demo Data)
    // ==============================================================================
    const S = {
      isLive: !!supabase,
      user: null,
      student: null,
      admin: false,
      tab: "showcase",        // 'showcase' | 'explore' | 'board' | 'submit' | 'admin'
      cat: "All",
      authTab: "student",     // 'student' | 'admin' | 'register'
      exploreSort: "highest", // 'highest' | 'newest' | 'trending'
      exploreSearch: "",
      exploreCat: "All",
      open: null,
      ready: false,
      ideas: [],
      mine: [],
      all: [],
      myVotes: new Set(),
      comments: [],
      dbModal: false,
      dbDiagnostics: null,
      dbTesting: false
    };

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const toast = (m, bad = false) => {
      const t = document.getElementById("toast");
      if (!t) return;
      t.innerHTML = `<div class="toast px-4 py-2.5 rounded-xl text-white text-sm shadow-lg ${bad ? "bg-red-600" : "bg-slate-900"}">${esc(m)}</div>`;
      setTimeout(() => { if (t) t.innerHTML = ""; }, 3500);
    };

    const run = async f => {
      try {
        await f();
      } catch (e) {
        console.error(e);
        toast(e.message || "Something went wrong", true);
      }
    };

    // ==============================================================================
    // 3. Database Diagnostics & Live Connectivity Engine
    // ==============================================================================
    async function runDbDiagnostics() {
      S.dbTesting = true;
      render();
      const start = performance.now();
      const report = {
        timestamp: new Date().toLocaleTimeString(),
        mode: supabase ? "Supabase Cloud (PostgreSQL)" : "Local Storage Database Engine",
        isLive: !!supabase,
        url: SUPABASE_URL || "Local / In-Browser",
        status: "Healthy",
        latencyMs: 0,
        readTest: "Pending",
        writeTest: "Pending",
        tables: {
          ideas: 0,
          students: 0,
          votes: 0,
          comments: 0
        },
        error: null
      };

      try {
        if (supabase) {
          const { data: idData, error: idErr } = await supabase.from('ideas').select('id');
          if (idErr) throw idErr;
          report.readTest = "PASSED (Cloud Connected)";
          report.tables.ideas = idData?.length || 0;

          const { data: stData } = await supabase.from('students').select('id');
          report.tables.students = stData?.length || 0;

          const { data: vtData } = await supabase.from('votes').select('id');
          report.tables.votes = vtData?.length || 0;

          const { data: cmData } = await supabase.from('comments').select('id');
          report.tables.comments = cmData?.length || 0;

          report.writeTest = "NOT TESTED (no safe cloud write probe configured)";
        } else {
          const ideas = JSON.parse(localStorage.getItem("sip_ideas") || "[]");
          const students = JSON.parse(localStorage.getItem("sip_students") || "[]");
          const votes = JSON.parse(localStorage.getItem("sip_votes") || "[]");
          const comments = JSON.parse(localStorage.getItem("sip_comments") || "[]");

          report.readTest = "PASSED (Local Read OK)";
          report.tables.ideas = ideas.length;
          report.tables.students = students.length;
          report.tables.votes = votes.length;
          report.tables.comments = comments.length;

          const testKey = "_sip_ping_test_" + Date.now();
          localStorage.setItem(testKey, "1");
          const val = localStorage.getItem(testKey);
          localStorage.removeItem(testKey);
          report.writeTest = val === "1" ? "PASSED (Write/Delete OK)" : "FAILED";
        }
        report.latencyMs = Math.max(1, Math.round(performance.now() - start));
      } catch (err) {
        report.status = "Connection Error";
        report.error = err.message;
        report.readTest = "FAILED";
        report.latencyMs = Math.round(performance.now() - start);
      }

      S.dbTesting = false;
      S.dbDiagnostics = report;
      render();
      return report;
    }

    // ==============================================================================
    // 4. Data Synchronization & Persistence
    // ==============================================================================
    async function loadData() {
      if (!supabase) {
        let localIdeas = [];
        try { localIdeas = JSON.parse(localStorage.getItem("sip_ideas")) || []; } catch (e) { }
        // Remove any demo ideas that were seeded earlier
        const cleanedIdeas = localIdeas.filter(i => !String(i.id || "").startsWith("idea-demo-"));
        if (cleanedIdeas.length !== localIdeas.length) {
          localIdeas = cleanedIdeas;
          localStorage.setItem("sip_ideas", JSON.stringify(localIdeas));
        }
        if (localIdeas.length === 0) {
          localIdeas = [...DEMO_IDEAS];
          localStorage.setItem("sip_ideas", JSON.stringify(localIdeas));
        }
        S.all = localIdeas;
        S.ideas = S.all.filter(i => i.status === "Approved");

        let localComments = [];
        try { localComments = JSON.parse(localStorage.getItem("sip_comments")) || []; } catch (e) { }
        S.comments = localComments;

        let localVotes = [];
        try { localVotes = JSON.parse(localStorage.getItem("sip_votes")) || []; } catch (e) { }

        if (S.student) {
          S.myVotes = new Set(localVotes.filter(v => v.student_id === S.student.id).map(v => v.idea_id));
          S.mine = S.all.filter(i => i.student_id === S.student.id);
        } else {
          S.myVotes = new Set();
          S.mine = [];
        }
        S.ready = true;
        render();
        return;
      }

      // Live Supabase queries
      try {
        const { data: ideasData, error: ideasErr } = await supabase
          .from('ideas')
          .select('*')
          .order('vote_count', { ascending: false });

        if (ideasErr) throw ideasErr;
        S.all = ideasData || [];
        S.ideas = S.all.filter(i => i.status === 'Approved');

        if (S.student) {
          S.mine = S.all.filter(i => i.student_id === S.student.id);
          const { data: votesData } = await supabase
            .from('votes')
            .select('idea_id')
            .eq('student_id', S.student.id);
          S.myVotes = new Set((votesData || []).map(v => v.idea_id));
        } else {
          S.mine = [];
          S.myVotes = new Set();
        }

        const { data: commentsData } = await supabase
          .from('comments')
          .select('*')
          .order('created_at', { ascending: true });
        S.comments = commentsData || [];

      } catch (err) {
        console.warn("Supabase fetch notice:", err.message);
      } finally {
        S.ready = true;
        render();
      }
    }

    let realtimeChannel = null;
    function setupRealtime() {
      if (!supabase) return;
      if (realtimeChannel) supabase.removeChannel(realtimeChannel);

      realtimeChannel = supabase
        .channel('portal-sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'ideas' }, () => loadData())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'votes' }, () => loadData())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, () => loadData())
        .subscribe();
    }

    async function initAuth() {
      // Validate session token and expiration
      const savedSession = localStorage.getItem("sip_session");
      if (savedSession) {
        try {
          const sess = JSON.parse(savedSession);
          if (sess?.expires_at && Date.now() > sess.expires_at) {
            localStorage.removeItem("sip_session");
            localStorage.removeItem("sip_current_student");
            console.warn("Session expired. Required re-authentication.");
          }
        } catch (e) {
          localStorage.removeItem("sip_session");
        }
      }

      if (supabase) {
        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (session?.user) {
            S.user = session.user;
            S.admin = isTrustedAdmin(S.user);
            const { data: prof } = await supabase
              .from('students')
              .select('*')
              .or(`auth_id.eq.${S.user.id},email.eq.${S.user.email}`)
              .maybeSingle();
            S.student = prof || (S.admin ? adminProfile(S.user) : null);
          }
          supabase.auth.onAuthStateChange(async (_event, session) => {
            if (session?.user) {
              S.user = session.user;
              S.admin = isTrustedAdmin(S.user);
              const { data: prof } = await supabase
                .from('students')
                .select('*')
                .or(`auth_id.eq.${S.user.id},email.eq.${S.user.email}`)
                .maybeSingle();
              S.student = prof || (S.admin ? adminProfile(S.user) : null);
            } else {
              S.user = null;
              S.student = null;
              S.admin = false;
            }
            loadData();
          });
        } catch (e) {
          console.error(e);
        }
      }

      const savedSt = localStorage.getItem("sip_current_student");
      const activeSession = localStorage.getItem("sip_session");
      if (savedSt && activeSession && !S.student) {
        try {
          const parsed = JSON.parse(savedSt);
          const sess = JSON.parse(activeSession);
          if (sess && sess.expires_at && Date.now() < sess.expires_at) {
            S.student = parsed;
            S.admin = false; // Local storage is user-editable and cannot grant admin privileges.
            S.user = { email: S.student.email, id: S.student.id };
          } else {
            localStorage.removeItem("sip_session");
            localStorage.removeItem("sip_current_student");
          }
        } catch (e) { }
      }
    }

    // ==============================================================================
    // 5. User Actions
    // ==============================================================================
    window.A = {
      tab: t => { S.tab = t; S.open = null; render(); },
      cat: c => { S.cat = c; render(); },
      toggle: id => { S.open = S.open === id ? null : id; render(); },
      switchAuthTab: t => { S.authTab = t; render(); },
      setExploreSort: s => { S.exploreSort = s; render(); },
      setExploreCat: c => { S.exploreCat = c; render(); },
      setExploreSearch: q => { S.exploreSearch = q; render(); },

      // Database Management & Live Diagnostics
      openDbModal: async () => {
        S.dbModal = true;
        if (!S.dbDiagnostics) await runDbDiagnostics();
        render();
      },
      closeDbModal: () => {
        S.dbModal = false;
        render();
      },
      runDbCheck: () => runDbDiagnostics(),
      saveSupabaseConfig: async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const url = (f.get("url") || "").trim();
        const key = (f.get("key") || "").trim();
        if (!url || !key) return toast("Please enter both Supabase URL and Anon Key.", true);
        try {
          const testClient = createClient(url, key);
          const { error } = await testClient.from('ideas').select('id').limit(1);
          if (error && !error.message.includes("does not exist") && !error.message.includes("relation")) {
            console.warn("Supabase check notice:", error.message);
          }
          localStorage.setItem("sip_supabase_url", url);
          localStorage.setItem("sip_supabase_key", key);
          SUPABASE_URL = url;
          SUPABASE_ANON_KEY = key;
          supabase = testClient;
          S.isLive = true;
          toast("Connected to Supabase successfully!");
          setupRealtime();
          await loadData();
          await runDbDiagnostics();
        } catch (err) {
          toast("Connection failed: " + err.message, true);
        }
      },
      disconnectSupabase: () => {
        localStorage.removeItem("sip_supabase_url");
        localStorage.removeItem("sip_supabase_key");
        SUPABASE_URL = "";
        SUPABASE_ANON_KEY = "";
        supabase = null;
        S.isLive = false;
        toast("Disconnected from Supabase. Running in Local Storage Mode.");
        loadData();
        runDbDiagnostics();
      },
      seedSampleIdeas: () => {
        localStorage.setItem("sip_ideas", JSON.stringify(DEMO_IDEAS));
        toast("Sample campus innovation pitches seeded into database!");
        loadData();
        runDbDiagnostics();
      },
      copySqlSchema: () => {
        const sql = `-- Supabase SQL Schema for Student Innovation Portal
-- SECURITY NOTE: Do not deploy permissive "Public All" policies. This app expects
-- faculty users to have app_metadata.role = 'admin' assigned by a trusted server/admin.
-- Configure the restrictive RLS policies for your schema before production use.
CREATE TABLE IF NOT EXISTS public.students (
    id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
    auth_id UUID,
    full_name TEXT NOT NULL,
    email TEXT UNIQUE NOT NULL,
    department TEXT NOT NULL,
    roll_number TEXT UNIQUE NOT NULL,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE IF NOT EXISTS public.ideas (
    id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
    student_id TEXT NOT NULL,
    author_name TEXT NOT NULL,
    author_department TEXT NOT NULL,
    title TEXT NOT NULL,
    category TEXT NOT NULL,
    description TEXT NOT NULL,
    status TEXT DEFAULT 'Pending',
    is_winner BOOLEAN DEFAULT false,
    winner_rank TEXT DEFAULT '',
    vote_count INTEGER DEFAULT 0,
    created_at TIMESTAMPTZ DEFAULT NOW(),
    updated_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE IF NOT EXISTS public.votes (
    id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
    idea_id UUID REFERENCES public.ideas(id) ON DELETE CASCADE,
    student_id TEXT NOT NULL,
    voter_name TEXT,
    voter_roll TEXT,
    created_at TIMESTAMPTZ DEFAULT NOW(),
    UNIQUE(idea_id, student_id)
);

CREATE TABLE IF NOT EXISTS public.comments (
    id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
    idea_id UUID REFERENCES public.ideas(id) ON DELETE CASCADE,
    student_id TEXT NOT NULL,
    commenter_name TEXT NOT NULL,
    commenter_department TEXT,
    comment_text TEXT NOT NULL,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

ALTER TABLE public.students ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.ideas ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.votes ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.comments ENABLE ROW LEVEL SECURITY;

-- Remove old permissive policies if this script is re-run.
DROP POLICY IF EXISTS "Public Read Students" ON public.students;
DROP POLICY IF EXISTS "Public All Students" ON public.students;
DROP POLICY IF EXISTS "Public Read Ideas" ON public.ideas;
DROP POLICY IF EXISTS "Public All Ideas" ON public.ideas;
DROP POLICY IF EXISTS "Public All Votes" ON public.votes;
DROP POLICY IF EXISTS "Public All Comments" ON public.comments;

-- Admin identity must be assigned in auth.users.app_metadata by a trusted
-- Supabase administrator/service-role process, never from client user metadata.
CREATE OR REPLACE FUNCTION public.is_portal_admin()
RETURNS BOOLEAN
LANGUAGE sql STABLE SECURITY DEFINER
SET search_path = public
AS $$
  SELECT COALESCE((auth.jwt() -> 'app_metadata' ->> 'role') = 'admin', false);
$$;

-- Students can read their own profile; admins can read all profiles.
CREATE POLICY "Students read own profile or admin reads all"
ON public.students FOR SELECT TO authenticated
USING (auth.uid() = auth_id OR public.is_portal_admin());

CREATE POLICY "Students create own profile"
ON public.students FOR INSERT TO authenticated
WITH CHECK (auth.uid() = auth_id AND NOT public.is_portal_admin());

CREATE POLICY "Students update own profile or admin"
ON public.students FOR UPDATE TO authenticated
USING (auth.uid() = auth_id OR public.is_portal_admin())
WITH CHECK (auth.uid() = auth_id OR public.is_portal_admin());

-- Public visitors can see approved ideas. Owners can see their own submissions.
CREATE POLICY "Read approved ideas or own ideas or admin"
ON public.ideas FOR SELECT
USING (
  status = 'Approved'
  OR public.is_portal_admin()
  OR EXISTS (SELECT 1 FROM public.students s WHERE s.id::text = ideas.student_id AND s.auth_id = auth.uid())
);

CREATE POLICY "Authenticated students submit ideas"
ON public.ideas FOR INSERT TO authenticated
WITH CHECK (
  status = 'Pending'
  AND NOT public.is_portal_admin()
  AND EXISTS (SELECT 1 FROM public.students s WHERE s.id::text = ideas.student_id AND s.auth_id = auth.uid())
);

CREATE POLICY "Owner withdraws pending idea or admin manages"
ON public.ideas FOR DELETE TO authenticated
USING (
  public.is_portal_admin()
  OR (status = 'Pending' AND EXISTS (
    SELECT 1 FROM public.students s WHERE s.id::text = ideas.student_id AND s.auth_id = auth.uid()
  ))
);

CREATE POLICY "Admin updates ideas"
ON public.ideas FOR UPDATE TO authenticated
USING (public.is_portal_admin())
WITH CHECK (public.is_portal_admin());

-- Votes: authenticated students may manage only their own votes; admins can moderate.
CREATE POLICY "Read votes"
ON public.votes FOR SELECT
USING (true);

CREATE POLICY "Students insert own votes"
ON public.votes FOR INSERT TO authenticated
WITH CHECK (

);

CREATE POLICY "Students delete own votes or admin"
ON public.votes FOR DELETE TO authenticated
USING (

  OR EXISTS (SELECT 1 FROM public.students s WHERE s.id::text = votes.student_id AND s.auth_id = auth.uid())
);

WITH CHECK (

);
CREATE POLICY "Delete own comments or admin"
ON public.comments FOR DELETE TO authenticated
USING (

      // Student Sign-In Action (Secure Authenticated Login)
      loginStudent: async (e) => {
        e.preventDefault();
        checkRateLimit();
        const f = new FormData(e.target);
        const identifier = (f.get("identifier") || "").trim();
        const password = f.get("password") || "";

        if (!identifier || !password) {
          return toast("Please enter both roll/email and your password.", true);
        }

        await run(async () => {
          if (supabase) {
            const { data, error } = await supabase.auth.signInWithPassword({ email: identifier, password });
            if (!error && data?.user) {
              resetRateLimit();
              S.user = data.user;
              const { data: prof } = await supabase.from('students').select('*').eq('email', identifier).maybeSingle();
              S.student = prof || { id: data.user.id, full_name: data.user.email.split("@")[0], email: data.user.email, department: "General", roll_number: "N/A" };
              S.admin = isTrustedAdmin(data.user);
              const session = { user_id: S.student.id, role: S.admin ? "admin" : "student", expires_at: Date.now() + (8 * 3600 * 1000) };
              localStorage.setItem("sip_session", JSON.stringify(session));
              localStorage.setItem("sip_current_student", JSON.stringify(S.student));
              toast("Welcome back, " + (S.student.full_name || "Student") + "!");
              S.tab = "explore";
              loadData();
              return;
            }
          }

          // Secure local student lookup & verification
          let registeredStudents = [];
          try { registeredStudents = JSON.parse(localStorage.getItem("sip_students")) || []; } catch (e) { }
          const found = registeredStudents.find(s =>
            s.email.toLowerCase() === identifier.toLowerCase() ||
            (s.roll_number && s.roll_number.toLowerCase() === identifier.toLowerCase())
          );

          if (!found) {
            recordFailedAttempt();
            throw new Error("Student account not found. Please click 'Register' tab to create your account.");
          }

          const inputHash = await hashPassword(password);
          if (found.password_hash !== inputHash) {
            recordFailedAttempt();
            throw new Error("Invalid password. Please verify your credentials.");
          }

          resetRateLimit();
          S.student = found;
          S.user = { email: found.email, id: found.id };
          S.admin = false;
          const session = { user_id: S.student.id, role: "student", expires_at: Date.now() + (8 * 3600 * 1000) };
          localStorage.setItem("sip_session", JSON.stringify(session));
          localStorage.setItem("sip_current_student", JSON.stringify(S.student));
          toast("Signed in successfully as " + S.student.full_name);
          S.tab = "explore";
          loadData();
        });
      },

      register: async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const fullName = f.get("name").trim();
        const rollNumber = f.get("roll").trim().toUpperCase();
        const department = f.get("dept").trim();
        const email = f.get("email").trim().toLowerCase();
        const password = f.get("password") || "";

        if (!fullName || fullName.length < 2) return toast("Full name must be at least 2 characters.", true);
        if (!rollNumber || rollNumber.length < 3) return toast("Please enter a valid Roll / Student ID.", true);
        if (!email || !email.includes("@")) return toast("Please enter a valid college email address.", true);
        if (password.length < 8 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
          return toast("Password must be at least 8 characters and contain both letters and numbers.", true);
        }

        await run(async () => {
          let registeredStudents = [];
          try { registeredStudents = JSON.parse(localStorage.getItem("sip_students")) || []; } catch (e) { }

          if (registeredStudents.some(s => s.email.toLowerCase() === email)) {
            throw new Error("A student account with this email address already exists.");
          }
          if (registeredStudents.some(s => s.roll_number.toUpperCase() === rollNumber)) {
            throw new Error("A student account with this Roll Number already exists.");
          }

          const password_hash = await hashPassword(password);

          if (supabase) {
            let authId = null;
            const { data: authData, error: authErr } = await supabase.auth.signUp({
              email,
              password,
              options: { data: { full_name: fullName, roll_number: rollNumber, department } }
            });
            if (authErr) throw authErr;
            if (authData?.user) authId = authData.user.id;

            const { data: stData, error: stErr } = await supabase
              .from('students')
              .upsert({
                auth_id: authId,
                full_name: fullName,
                email,
                department,
                roll_number: rollNumber
              }, { onConflict: 'email' })
              .select()
              .single();

            if (stErr) throw stErr;
            S.student = stData;
          } else {
            S.student = {
              id: "st-" + Date.now(),
              full_name: fullName,
              email,
              department,
              roll_number: rollNumber,
              password_hash
            };
            registeredStudents.push(S.student);
            localStorage.setItem("sip_students", JSON.stringify(registeredStudents));
          }

          const session = { user_id: S.student.id, role: "student", expires_at: Date.now() + (8 * 3600 * 1000) };
          localStorage.setItem("sip_session", JSON.stringify(session));
          localStorage.setItem("sip_current_student", JSON.stringify(S.student));
          S.user = { email, id: S.student.id };
          S.admin = false;
          toast("Student account registered successfully!");
          S.tab = "explore";
          loadData();
        });
      },

      // Real-time Voting (Fair-Play Authorization Enforced)
      vote: (id) => run(async () => {
        if (!S.student) {
          toast("Authentication required: Please sign in as a student to vote.", true);
          S.tab = "submit";
          S.authTab = "student";
          render();
          return;
        }

        const idea = S.ideas.find(x => x.id === id) || S.all.find(x => x.id === id);
        if (!idea) throw new Error("Idea not found.");
        if (idea.status !== "Approved") throw new Error("Voting is only permitted on approved ideas.");
        if (idea.student_id === S.student.id) {
          throw new Error("Fair Play: You cannot vote for your own submitted pitch.");
        }

        const had = S.myVotes.has(id);
        if (had) {
          S.myVotes.delete(id);
          idea.vote_count = Math.max(0, (idea.vote_count || 1) - 1);
          toast(`Vote removed from "${idea.title}"`);
        } else {
          S.myVotes.add(id);
          idea.vote_count = (idea.vote_count || 0) + 1;
          toast(`🔥 Upvoted! "${idea.title}" now has ${idea.vote_count} votes.`);
        }

        render();

        if (supabase) {
          if (had) {
            await supabase.from('votes').delete().match({ idea_id: id, student_id: S.student.id });
          } else {
            await supabase.from('votes').insert({
              idea_id: id,
              student_id: S.student.id,
              voter_name: S.student.full_name,
              voter_roll: S.student.roll_number
            });
          }
          loadData();
        } else {
          let localVotes = [];
          try { localVotes = JSON.parse(localStorage.getItem("sip_votes")) || []; } catch (e) { }
          if (had) {
            localVotes = localVotes.filter(v => !(v.idea_id === id && v.student_id === S.student.id));
          } else {
            localVotes.push({ idea_id: id, student_id: S.student.id });
          }
          localStorage.setItem("sip_votes", JSON.stringify(localVotes));
          localStorage.setItem("sip_ideas", JSON.stringify(S.all));
        }
      }),

            class="flex-1 py-2 rounded-lg transition ${isStudentTab ? 'bg-white text-blue-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'}"
            onclick="A.switchAuthTab('student')">
            👨‍🎓 Student
          </button>
          <button
            class="flex-1 py-2 rounded-lg transition ${isAdminTab ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'}"
            onclick="A.switchAuthTab('admin')">
            👔 Admin / Faculty
          </button>
          <button
            class="flex-1 py-2 rounded-lg transition ${isRegisterTab ? 'bg-white text-blue-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'}"
            onclick="A.switchAuthTab('register')">
            📝 Register
          </button>
        </div>

        <!-- 1. STUDENT SIGN-IN FORM -->
        ${isStudentTab ? `
          <form onsubmit="A.loginStudent(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">College Email or Roll Number</label>
              <input name="identifier" required class="in text-sm" placeholder="e.g. 21CS045 or student@college.edu" />
            </div>

            <div>
              <div class="flex justify-between items-center mb-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Password</label>
              </div>
              <div class="relative">
                <input
                  id="student-pwd"
                  name="password"
                  type="password"
                  required
                  class="in text-sm pr-11"
                  placeholder="••••••••"
                />
                <button
                  type="button"
                  onclick="A.togglePwd('student-pwd', this)"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition"
                  title="Show password">
                  <svg class="w-5 h-5 text-slate-400 hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>

            <button class="btn w-full py-2.5 text-base font-bold shadow-sm">
              Sign In as Student &rarr;
            </button>

            <div class="pt-3 border-t border-slate-100 text-center">
              <p class="text-xs text-slate-500">
                Committee member or Evaluator?
                <button type="button" onclick="A.switchAuthTab('admin')" class="text-blue-700 font-bold hover:underline ml-1">
                  Faculty / Admin Login &rarr;
                </button>
              </p>
            </div>
          </form>
        ` : ""}

        <!-- 2. ADMIN / FACULTY SIGN-IN FORM -->
        ${isAdminTab ? `
          <form onsubmit="A.loginAdmin(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Admin ID or Faculty Email</label>
              <input
                name="email"
                type="text"
                required
                class="in text-sm"
                placeholder="Enter admin"
              />
            </div>

            <div>
              <div class="flex justify-between items-center mb-1.5">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Admin Password</label>
              </div>
              <div class="relative">
                <input
                  id="admin-pwd"
                  name="password"
                  type="password"
                  required
                  class="in text-sm pr-11"
                  placeholder="Enter admin password"
                />
                <button
                  type="button"
                  onclick="A.togglePwd('admin-pwd', this)"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition"
                  title="Show password">
                  <svg class="w-5 h-5 text-slate-400 hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>

            <button class="btn w-full py-2.5 text-base font-bold !bg-indigo-700 hover:!bg-indigo-800 shadow-sm">
              Sign In to Admin Dashboard &rarr;
            </button>

            <div class="pt-3 border-t border-slate-100 text-center">
              <p class="text-xs text-slate-500">
                Are you a student?
                <button type="button" onclick="A.switchAuthTab('student')" class="text-indigo-700 font-bold hover:underline ml-1">
                  Switch to Student Login
                </button>
              </p>
            </div>
          </form>
        ` : ""}

        <!-- 3. STUDENT REGISTRATION FORM -->
        ${isRegisterTab ? `
          <form onsubmit="A.register(event)" class="space-y-3.5">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Full Name</label>
              <input name="name" required class="in text-sm" placeholder="e.g. Asha Reddy" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Roll / Student ID</label>
                <input name="roll" required class="in text-sm" placeholder="21CS045" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Department</label>
                <select name="dept" class="in text-sm">
                  <option>Computer Science (CSE)</option>
                  <option>Electronics & Comm. (ECE)</option>
                  <option>Mechanical (MECH)</option>
                  <option>Electrical & Electronics (EEE)</option>
                  <option>Information Technology (IT)</option>
                  <option>Civil Engineering</option>
                  <option>Biotechnology</option>
                  <option>Business / MBA</option>
                  <option>Other Department</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">College Email</label>
              <input name="email" type="email" required class="in text-sm" placeholder="you@college.edu" />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Create Password</label>
              <div class="relative">
                <input
                  id="reg-pwd"
                  name="password"
                  type="password"
                  minlength="8"
                  required
                  class="in text-sm pr-11"
                  placeholder="Min. 8 chars (letters & numbers)"
                />
                <button
                  type="button"
                  onclick="A.togglePwd('reg-pwd', this)"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition"
                  title="Show password">
                  <svg class="w-5 h-5 text-slate-400 hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>

            <button class="btn w-full py-2.5 text-base font-bold shadow-sm mt-1">
              Register Student Account
            </button>
          </form>
        ` : ""}
      </div>`;
    };

    // Admin View
    const admin = () => {
      if (!S.admin) return '<div class="py-16 text-center text-slate-500 bg-white rounded-2xl border border-slate-200"><p class="text-lg font-bold">Admin Portal</p><p class="text-sm mt-1">Please sign in with administrator / faculty credentials.</p><button class="btn mt-4 text-xs font-bold" onclick="A.tab(\'submit\'); A.switchAuthTab(\'admin\');">Go to Admin/Faculty Login &rarr;</button></div>';

      const by = s => S.all.filter(i => i.status === s);
      const row = i => `
        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
          <div class="flex flex-wrap gap-2 items-center">
            ${stat(i.status)}
            ${badge(i)}
            <b class="text-slate-900">${esc(i.title)}</b>
            <span class="text-sm text-slate-500">&bull; ${esc(i.author_name)} (${esc(i.author_department)}) &bull; ${i.vote_count || 0} votes</span>
          </div>
          <p class="text-sm text-slate-700 mt-2 whitespace-pre-line leading-relaxed">${esc(i.description)}</p>
          <div class="flex flex-wrap gap-2 mt-4 pt-3 border-t border-slate-100">
            ${i.status !== "Approved" ? `<button class="ghost !bg-emerald-600 !text-white !border-emerald-600 text-xs font-bold" onclick="A.setStatus('${i.id}','Approved')">✓ Approve</button>` : ""}
            ${i.status !== "Rejected" ? `<button class="ghost !bg-red-600 !text-white !border-red-600 text-xs font-bold" onclick="A.setStatus('${i.id}','Rejected')">✕ Reject</button>` : ""}
            ${i.status === "Approved" ? `<button class="ghost text-xs font-bold" onclick="A.rank('${i.id}')">🏆 Set Winner Rank</button>` : ""}
            <button class="ghost !text-red-600 text-xs ml-auto" onclick="A.del('${i.id}')">Delete</button>
          </div>
        </div>`;

      return `
      <div>
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Admin & Faculty Moderation</h1>
            <p class="text-xs text-slate-500">Review student innovation pitches, grant approvals, and award official winner ranks.</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="A.purgeAllIdeas()" class="ghost !text-red-600 hover:!bg-red-50 text-xs font-bold border-red-200 shadow-xs" title="Wipe all ideas, votes, and comments permanently">
              🧹 Clear All Ideas
            </button>
            <span class="text-xs bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full">Admin Active</span>
          </div>
        </div>
        ${["Pending", "Approved", "Rejected"].map(s => `
          <div class="mb-8">
            <h2 class="text-lg font-bold mb-3 flex items-center gap-2">
              <span>${s} Ideas</span>
              <span class="text-xs font-bold bg-slate-200 text-slate-700 px-2.5 py-0.5 rounded-full">${by(s).length}</span>
            </h2>
            <div class="space-y-3">
              ${by(s).map(row).join("") || '<p class="text-sm text-slate-400 bg-white border border-slate-200 rounded-2xl p-5 text-center">No ' + s.toLowerCase() + ' ideas.</p>'}
            </div>
          </div>
        `).join("")}
      </div>`;
    };

    // ==============================================================================
    // Database Diagnostics Modal View
    // ==============================================================================
    const dbModalView = () => {
      if (!S.dbModal) return "";
      const d = S.dbDiagnostics || {
        status: "Healthy",
        mode: S.isLive ? "Supabase Cloud (PostgreSQL)" : "Local Storage Database Engine",
        latencyMs: 1,
        readTest: "PASSED",
        writeTest: "PASSED",
        tables: {
          ideas: S.ideas.length,
          students: (JSON.parse(localStorage.getItem("sip_students") || "[]")).length,
          votes: (JSON.parse(localStorage.getItem("sip_votes") || "[]")).length,
          comments: S.comments.length
        }
      };
      const isLive = S.isLive;

      return `
      <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-7 shadow-2xl border border-slate-200 relative my-8">
          <div class="flex items-center justify-between pb-4 border-b border-slate-100">
            <div class="flex items-center gap-2.5">
              <div class="w-10 h-10 rounded-xl ${isLive ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-blue-600'} flex items-center justify-center text-xl font-bold">
                🗄️
              </div>
              <div>
                <h3 class="font-extrabold text-lg text-slate-900">Database Connectivity & Diagnostics</h3>
                <p class="text-xs text-slate-500">Real-time health monitor, schema verification, and latency checks</p>
              </div>
            </div>
            <button onclick="A.closeDbModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-800 flex items-center justify-center text-sm font-bold">✕</button>
          </div>

          <!-- Health Snapshot Card -->
          <div class="mt-5 p-4 rounded-2xl ${d.status === 'Healthy' || !d.status ? 'bg-emerald-50 border border-emerald-200' : 'bg-red-50 border border-red-200'}">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full ${d.status === 'Healthy' || !d.status ? 'bg-emerald-500 animate-ping' : 'bg-red-500'}"></span>
                <span class="text-sm font-extrabold ${d.status === 'Healthy' || !d.status ? 'text-emerald-900' : 'text-red-900'}">
                  ${d.status === 'Healthy' || !d.status ? 'Database Online & Operational' : 'Database Connection Warning'}
                </span>
              </div>
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${isLive ? 'bg-emerald-200 text-emerald-800' : 'bg-blue-200 text-blue-800'}">
                ${isLive ? 'Cloud Supabase' : 'Local Storage Engine'}
              </span>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t ${d.status === 'Healthy' || !d.status ? 'border-emerald-200/60 text-emerald-800' : 'border-red-200 text-red-800'} text-xs">
              <div><span class="text-slate-500 block">Ping Latency:</span> <b>${d.latencyMs ?? 1} ms</b></div>
              <div><span class="text-slate-500 block">Read Test:</span> <b>${d.readTest || 'PASSED'}</b></div>
              <div><span class="text-slate-500 block">Write Test:</span> <b>${d.writeTest || 'PASSED'}</b></div>
            </div>
          </div>

          <!-- Tables Diagnostics -->
          <div class="mt-4">
            <h4 class="text-xs font-bold uppercase text-slate-500 tracking-wider mb-2">Verified Table Entities</h4>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-center">
                <span class="text-[11px] text-slate-500 block">Ideas</span>
                <b class="text-base text-slate-800">${d.tables?.ideas ?? 0}</b>
                <span class="text-[10px] text-emerald-600 block font-semibold">✓ Verified</span>
              </div>
              <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-center">
                <span class="text-[11px] text-slate-500 block">Students</span>
                <b class="text-base text-slate-800">${d.tables?.students ?? 0}</b>
                <span class="text-[10px] text-emerald-600 block font-semibold">✓ Verified</span>
              </div>
              <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-center">
                <span class="text-[11px] text-slate-500 block">Votes</span>
                <b class="text-base text-slate-800">${d.tables?.votes ?? 0}</b>
                <span class="text-[10px] text-emerald-600 block font-semibold">✓ Verified</span>
              </div>
              <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-center">
                <span class="text-[11px] text-slate-500 block">Comments</span>
                <b class="text-base text-slate-800">${d.tables?.comments ?? 0}</b>
                <span class="text-[10px] text-emerald-600 block font-semibold">✓ Verified</span>
              </div>
            </div>
          </div>

          <!-- Connect to Cloud Supabase (Optional) -->
          <div class="mt-5 p-4 rounded-2xl bg-slate-50 border border-slate-200">
            <div class="flex items-center justify-between mb-1.5">
              <h4 class="text-xs font-bold uppercase text-slate-700 tracking-wider">Cloud Database Integration (Supabase)</h4>
              ${isLive ? `<button onclick="A.disconnectSupabase()" class="text-xs text-red-600 font-bold hover:underline">Disconnect</button>` : ''}
            </div>
            <p class="text-xs text-slate-500 mb-3">Optional: To sync campus ideas across all students and devices in real-time, connect your Supabase project:</p>
            <form onsubmit="A.saveSupabaseConfig(event)" class="space-y-2.5">
              <input name="url" value="${esc(SUPABASE_URL)}" placeholder="https://your-project.supabase.co" class="in text-xs !py-2" />
              <input name="key" value="${esc(SUPABASE_ANON_KEY)}" placeholder="eyJhbGciOi..." class="in text-xs !py-2" />
              <div class="flex gap-2">
                <button type="submit" class="btn text-xs py-2 px-3 font-bold flex-1">
                  ${isLive ? 'Update & Reconnect' : 'Connect to Supabase'}
                </button>
                <button type="button" onclick="A.copySqlSchema()" class="ghost text-xs py-2 px-3 font-bold text-slate-700 hover:bg-slate-100" title="Copy SQL schema for Supabase SQL Editor">
                  📋 Copy SQL DDL
                </button>
              </div>
            </form>
          </div>

          <!-- Diagnostics Action Controls -->
          <div class="mt-5 flex flex-wrap gap-2 justify-between items-center pt-3 border-t border-slate-100">
            <button onclick="A.runDbCheck()" class="btn text-xs py-2 px-3.5 bg-slate-900 hover:bg-slate-800 font-bold flex items-center gap-1.5">
              <span>🔄</span> Run Test Again
            </button>
            <div class="flex gap-2">
              <button onclick="A.seedSampleIdeas()" class="ghost text-xs py-2 px-3 font-bold text-blue-700 hover:bg-blue-50 border-blue-200">
                💡 Seed Demo Pitches
              </button>
              <button onclick="A.closeDbModal()" class="ghost text-xs py-2 px-3.5 font-bold">
                Done
              </button>
            </div>
          </div>
        </div>
      </div>`;
    };

    // ==============================================================================
    // 6. Render Orchestrator
    // ==============================================================================
    let rt;
    function render() {
      const a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.value && document.getElementById("app")?.contains(a)) {
        clearTimeout(rt);
        rt = setTimeout(render, 1500);
        return;
      }
      draw();
    }

    function draw() {
      const tabs = [
        ["showcase", "Ideas"],
        ["explore", "Explore Ideas"],
        ["board", "Leaderboard"],
        ["submit", "Submit Idea"],
        ...(S.admin ? [["admin", "Admin"]] : [])
      ];

      const body = !S.ready
        ? '<div class="py-24 text-center text-slate-500"><div class="inline-block animate-spin text-3xl mb-3">⟳</div><p>Loading Innovation Portal...</p></div>'
        : { showcase, explore: exploreView, board, submit: submitView, admin }[S.tab]();

      document.getElementById("app").innerHTML = `
      <header class="bg-[#101828] text-white">
        <div class="max-w-4xl mx-auto px-4 py-8">
          <div class="flex items-center justify-between gap-3 mb-6">
            <span class="hd font-extrabold text-lg tracking-tight flex items-center gap-2">
              <span>🎓</span> Student Innovation Portal
            </span>
            <div class="flex items-center gap-3 text-sm">
              ${S.student ? `
                <span class="hidden sm:inline text-slate-300 font-medium">
                  👋 ${esc(S.student.full_name)}
                  ${S.admin ? '<span class="text-[10px] bg-indigo-500/40 text-indigo-200 border border-indigo-400/40 px-2 py-0.5 rounded-full font-bold ml-1 uppercase">Faculty</span>' : ''}
                </span>
                <button class="ghost !bg-transparent !text-white !border-slate-600 hover:!border-white text-xs" onclick="A.logout()">Sign Out</button>
              ` : `
                <div class="flex items-center gap-2">
                  <button class="btn text-xs font-bold" onclick="A.tab('submit'); A.switchAuthTab('student');">Student Sign In</button>
                  <button class="ghost !bg-transparent !text-white !border-slate-600 hover:!border-white text-xs font-bold" onclick="A.tab('submit'); A.switchAuthTab('admin');">Admin / Faculty</button>
                </div>
              `}
            </div>
          </div>
          <h1 class="text-3xl sm:text-5xl font-extrabold leading-tight max-w-2xl">
            Pitch it. Get votes. Build what your campus needs.
          </h1>
          <p class="mt-3 text-slate-300 max-w-xl text-sm sm:text-base">
            Campus student innovation showcase, peer voting, comments, and real-time ranked leaderboard.
          </p>
        </div>
      </header>

      <!-- Navigation Bar -->
      <nav class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 flex gap-1 overflow-x-auto">
          ${tabs.map(([k, l]) => `
            <button onclick="A.tab('${k}')" class="px-4 py-3 font-semibold border-b-2 whitespace-nowrap transition text-sm ${S.tab === k ? "border-blue-600 text-blue-700 font-bold" : "border-transparent text-slate-600 hover:text-slate-900"}">
              ${k === 'explore' ? '🔥 ' + l : l}
            </button>
          `).join("")}
        </div>
      </nav>

      <main class="max-w-4xl mx-auto px-4 py-8">
        ${body}
      </main>

      <footer class="border-t border-slate-200 mt-16 py-8 text-center text-xs text-slate-400">
        Student Innovation Portal &bull; Campus Innovation & Entrepreneurship Cell
        &bull; <button class="underline hover:text-slate-600" onclick="A.openDbModal()">${S.isLive ? "🟢 Database: Supabase" : "⚪ Database: Local mode (connect Supabase)"}</button>
      </footer>
      ${dbModalView()}`;
    }

    // Kickoff
    setupRealtime();
    initAuth().then(() => loadData());
  </script>
</body>

</html>
